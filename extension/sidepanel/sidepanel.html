<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GenMusicAssist — Library & Curation</title>
<style>
:root{
  --bg:#0b0d12;--panel:#12161e;--line:#222a38;--tx:#e6ebf4;--dim:#8494ad;
  --ok:#38d39f;--warn:#ffb454;--bad:#ff5c6c;--acc:#8b7cf6;--blue:#3b82f6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:#0b0d12f2;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:5;backdrop-filter:blur(8px)}
h1{font-size:13px;margin:0;font-weight:650;letter-spacing:.3px;flex:1}
button,select,input{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover{background:#1b2230}
button.pri{background:#2d2544;border-color:#5b4b95}
button.dz{background:#3c1d28;border-color:#7a3547}
button.on{border-color:var(--ok);color:var(--ok)}
main{padding:10px 12px 40px}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:4px 11px;font-size:12px}
.tabs button[aria-selected=true]{background:#1f2736;border-color:var(--acc);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:9px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}
.title{font-weight:600;font-size:13px}
.meta{color:var(--dim);font-size:11.5px}
.mono{font-variant-numeric:tabular-nums}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pill{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:10.5px;color:var(--dim)}
.pill.on{color:var(--ok);border-color:#2f7a5b;background:#11291f}
.pill.warn{color:var(--warn);border-color:#6b4d20;background:#231a10}
.pill.bad{color:var(--bad);border-color:#6b2130;background:#231014}
.score{font-size:20px;font-weight:700;text-align:right;min-width:44px;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:10px;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.wf{height:34px;width:100%;display:block;background:#0e1118;border-radius:7px;border:1px solid var(--line);margin-top:5px}
.coverage{height:6px;border-radius:4px;background:#1b2130;overflow:hidden;display:flex}
.coverage i{display:block;height:100%;background:var(--ok);opacity:.85}
.coverage u{display:block;height:100%;background:#39405680;flex:1}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
label{font-size:11.5px;color:var(--dim);display:flex;gap:6px;align-items:center}
input[type=text],input[type=number]{cursor:text;width:150px}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px}
.kv b{color:var(--dim);font-weight:500}
.empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:12px}
.seg{display:grid;grid-template-columns:52px 1fr 44px;gap:6px;align-items:center;font-size:11px;padding:2px 0;border-bottom:1px solid #191f2b}
.seg .bar{height:5px;background:#1b2130;border-radius:3px;overflow:hidden}
.seg .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--blue))}
details summary{cursor:pointer;font-size:11.5px;color:var(--dim)}
#status{font-size:11px;color:var(--dim)}
.flash{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#161b25;border:1px solid var(--line);border-left:3px solid var(--blue);padding:7px 12px;border-radius:9px;font-size:12px;box-shadow:0 10px 30px #000a;z-index:9}
.flash.err{border-left-color:var(--bad)}.flash.ok{border-left-color:var(--ok)}
</style>
</head>
<body>
<header>
  <h1>GenMusicAssist</h1>
  <button id="refresh" title="Reload library">↻</button>
  <button id="ping" title="Check the desktop app">App</button>
</header>
<main>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="triage" aria-selected="true">Triage</button>
    <button role="tab" data-t="captures" aria-selected="false">Captures</button>
    <button role="tab" data-t="library" aria-selected="false">Suno library</button>
    <button role="tab" data-t="reflect" aria-selected="false">Reflect</button>
    <button role="tab" data-t="settings" aria-selected="false">Settings</button>
  </div>
  <div id="view"></div>
  <p id="status"></p>
</main>
<script src="../lib/sunolift-bundle.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
